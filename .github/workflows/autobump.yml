name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Hourly, off the top of the hour when GitHub drops scheduled runs more
    # often. A skipped run is picked up by the next one.
    - cron: 17 * * * *
  # Sent by tool repositories after a release, so that the bump does not wait
  # for the schedule, which GitHub may delay or skip.
  repository_dispatch:
    types:
      - bump
  workflow_dispatch:
    inputs:
      formulae:
        description: Space-separated formulae to bump (all formulae in the tap when empty)
        required: false
        default: ""

permissions: {}

concurrency:
  group: autobump
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    steps:
      # Pull requests opened with GITHUB_TOKEN do not trigger tests.yml,
      # so open them with the GitHub App token instead.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          brew-gh-api-token: ${{ steps.app-token.outputs.token }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          username: ${{ steps.app-token.outputs.app-slug }}[bot]

      - name: Bump formulae and casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          FORMULAE: ${{ inputs.formulae }}
        run: |
          if [[ -n "${FORMULAE:-}" ]]
          then
            read -ra names <<< "$FORMULAE"
            brew bump --no-fork --open-pr --bump-synced "${names[@]/#/$TAP_NAME/}"
          else
            brew bump --no-fork --open-pr --bump-synced --tap="$TAP_NAME"
          fi

      # Merge bump pull requests automatically once the required checks pass.
      # The author is filtered with jq, because `--author` makes `gh pr list`
      # use the search API, which can miss pull requests opened moments ago.
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,author,autoMergeRequest \
            --jq '.[] | select(.author.login == "app/\(env.APP_SLUG)" and .autoMergeRequest == null) | .number' |
            while read -r number
            do
              gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash
            done
